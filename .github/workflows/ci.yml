name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.container }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        container:
          - ubuntu:latest
          - alpine:latest

    container:
      image: ${{ matrix.container }}
      options: --user root

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: "Install dependencies (Ubuntu)"
        if: matrix.container == 'ubuntu:latest'
        run: apt-get update && apt-get install -y gcc make libreadline-dev

      - name: "Install dependencies (Alpine)"
        if: matrix.container == 'alpine:latest'
        run: apk add --no-cache gcc make musl-dev readline-dev

      - name: "Build"
        run: make

      - name: "Test"
        run: make test

  sanitizer:
    name: "Address Sanitizer"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7

      - name: "Install dependencies"
        run: sudo apt-get update && sudo apt-get install -y make libreadline-dev

      - name: "Run tests with address sanitizer"
        run: DEBUG=1 make test-asan
